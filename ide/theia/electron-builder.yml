appId: com.bibzcode.ide
productName: BibzCode IDE
copyright: Copyright © 2026 BibzCode
artifactName: BibzCode-IDE-${version}-${os}-${arch}.${ext}

# The Theia Electron bundle and pre-installed plugins live in the monorepo root.
directories:
  app: .
  output: dist

extraMetadata:
  main: electron-app/lib/backend/electron-main.js

files:
  - electron-app/lib/**/*
  - electron-app/src-gen/**/*
  - electron-app/package.json
  - plugins/**/*
  - bibzcode-ide/package.json
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**'
  - '!**/.cache/**'
  - '!**/coverage/**'
  - '!**/src/**'
  - '!**/test/**'

extraResources:
  - from: electron-app/native/windows
    to: native/windows
    filter:
      - '**/*'

compression: store
asar: true
asarUnpack:
  - electron-app/lib/backend/native/**/*
  - electron-app/lib/prebuilds/**/*
  - native/windows/**/*

npmRebuild: false
removePackageScripts: true

linux:
  category: Development
  synopsis: Extensible BibzCode development environment
  description: BibzCode IDE with Theia workbench and VS Code extension compatibility.
  syncDesktopName: true
  target:
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: AppImage
      arch:
        - x64

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BibzCode IDE

portable:
  artifactName: BibzCode-IDE-${version}-portable-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  title: BibzCode IDE
  writeUpdateInfo: true

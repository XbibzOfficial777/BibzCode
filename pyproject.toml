[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "bibzcode-cli-agent"
version = "7.8.0.post6"
description = "Multi-provider terminal AI agent with controlled tool execution"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "XbibzOfficial" }]
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13.7,<15",
  "PyYAML>=6,<7",
  "pydantic>=2.7,<3",
  "ddgs>=9,<10",
  "defusedxml>=0.7,<1",
  "pypdf>=6.15,<7",
  "python-docx>=1.1,<2",
  "Pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
full = [
  "reportlab>=4,<5", "selenium>=4.20,<5", "webdriver-manager>=4,<5",
  "mcp>=1.10,<2", "matplotlib>=3.8,<4",
]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
bzcli = "bibzcode.__main__:main"
dscli = "bibzcode.__main__:main" # compatibility alias

[tool.hatch.build.targets.wheel]
packages = ["bibzcode", "deepseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

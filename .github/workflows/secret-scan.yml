name: Secret Pattern Scan

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Hardcoded secret pattern scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run redacted secret scan
        run: python3 scripts/secret_scan.py

name: Build BibzCode Theia IDE

on:
  workflow_dispatch:
  push:
    tags:
      - 'ide-v*'

permissions:
  contents: read

concurrency:
  group: theia-ide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }} Debian package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: arm64
          - runner: ubuntu-24.04
            arch: armv7l
            target: armv7l
    defaults:
      run:
        working-directory: ide/theia
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ide/theia/package-lock.json
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Install dependencies
        run: npm ci
      - name: Build and package Debian
        run: npm run package:linux:${{ matrix.arch }}
        env:
          ELECTRON_BUILDER_CONCURRENCY: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate Debian metadata
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -maxdepth 1 -type f -name '*${{ matrix.arch }}.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb" | tee metadata.txt
          grep -Eq 'Architecture: (amd64|arm64|armhf)' metadata.txt
          sha256sum "$deb" > SHA256SUMS
      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: bibzcode-theia-linux-${{ matrix.arch }}
          path: |
            ide/theia/dist/*.deb
            ide/theia/SHA256SUMS
            ide/theia/metadata.txt
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    runs-on: windows-2025
    defaults:
      run:
        working-directory: ide/theia
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ide/theia/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer and portable package
        run: npm run package:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bibzcode-theia-windows-x64
          path: |
            ide/theia/dist/*.exe
            ide/theia/dist/*.blockmap
          if-no-files-found: error

  macos:
    name: macOS x64 package
    runs-on: macos-14
    defaults:
      run:
        working-directory: ide/theia
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ide/theia/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build macOS package
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bibzcode-theia-macos-x64
          path: |
            ide/theia/dist/*.dmg
            ide/theia/dist/*.zip
            ide/theia/dist/*.blockmap
          if-no-files-found: error

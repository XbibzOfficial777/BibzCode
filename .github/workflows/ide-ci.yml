name: IDE production checks

on:
  push:
    branches: [main, nightly]
    paths:
      - 'ide/**'
      - 'bibzcode/**'
      - 'deepseek/**'
      - 'requirements*.txt'
      - '.github/workflows/ide-ci.yml'
  pull_request:
    branches: [main, nightly]
    paths:
      - 'ide/**'
      - 'bibzcode/**'
      - 'deepseek/**'
      - 'requirements*.txt'
      - '.github/workflows/ide-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: IDE verify (Node 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: ide/package-lock.json
      - name: Install exact dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - name: Dependency audit
        run: |
          npm audit
          npm audit --omit=dev
      - name: Typecheck, lint, unit tests, and production build
        run: npm run verify
      - name: Install Electron smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - name: Secure production-window smoke
        run: xvfb-run -a npm run test:e2e
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibzcode-ide-smoke
          path: ide/test-results/bibzcode-ide.png
          if-no-files-found: warn
          retention-days: 14

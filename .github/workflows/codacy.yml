name: Security Code Scan

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  schedule:
    - cron: '29 16 * * 4'

permissions:
  contents: read

jobs:
  security-code-scan:
    name: Bandit security scan (SARIF)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Bandit
        run: python -m pip install 'bandit>=1.8,<2'
      - name: Run Bandit JSON scan
        id: bandit
        continue-on-error: true
        run: |
          set +e
          bandit -q -r bibzcode --severity-level medium --format json --output bandit.json
          status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" -gt 1 ]; then exit "${status}"; fi
      - name: Convert Bandit results to SARIF
        if: always()
        run: python3 scripts/bandit_to_sarif.py bandit.json results.sarif
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: bandit
      - name: Enforce Bandit result
        if: always()
        run: test "${{ steps.bandit.outputs.exit_code }}" = "0"

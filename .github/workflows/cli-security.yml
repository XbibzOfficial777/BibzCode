name: CLI security checks

on:
  push:
    branches: [nightly]
  pull_request:
    branches: [nightly]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked runtime and test tools
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install 'pytest>=8,<10' 'pyflakes>=3,<4' 'bandit>=1.8,<2' 'build>=1.2,<2'
      - name: Compile and unit tests
        run: |
          python -m compileall -q deepseek tests
          python -m pytest -q
          python -m pyflakes deepseek tests
      - name: Static security scan
        run: bandit -q -r deepseek --severity-level medium
      - name: Build package
        run: python -m build
      - name: Verify deterministic CLI release
        run: |
          python scripts/build_release.py
          git diff --exit-code -- install.sh releases/

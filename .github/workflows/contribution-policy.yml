name: Contribution policy

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository and community policy
        run: python scripts/check_community.py
